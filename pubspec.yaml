name: aafiyah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.0.0
  cloud_firestore: ^5.6.12
  google_generative_ai: ^0.4.5
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.3.2
  health: ^11.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.1
  intl: ^0.19.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  table_calendar: ^3.1.2
  fl_chart: ^0.70.2
  firebase_storage: ^12.4.10
  file_picker: ^11.0.3
  image_cropper: ^12.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_mlkit_text_recognition: ^0.16.0
  pdfx: 2.8.0
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/aafiya_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/aafiya_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
